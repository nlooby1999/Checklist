<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner with Mark Off &amp; Check Off Modes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .file-input,
        .scanner-input,
        .toggle-btn,
        .clear-btn,
        .report-btn {
            display: block;
            margin: 10px auto;
            padding: 10px;
            font-size: 18px;
            width: 80%;
            cursor: pointer;
            text-align: center;
            border: 2px solid #333;
            background-color: #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
        }

        .matched {
            background-color: #90EE90;
        }

        .completed {
            background-color: #32CD32;
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>Barcode Scanner with Mark Off &amp; Check Off Modes</h1>

    <input type="file" id="excelFile" class="file-input" accept=".xlsx, .xls">
    <input type="text" id="scannerInput" class="scanner-input" placeholder="Scan barcode here" disabled autofocus>
    <div id="toggleMode" class="toggle-btn">Mode: Mark Off</div>
    <div id="clearChecklist" class="clear-btn">Clear Checklist</div>
    <div id="downloadReport" class="report-btn">Download Report</div>

    <div id="tableContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
